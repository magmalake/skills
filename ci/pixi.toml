# The environment the skills' `mojo compile` examples are built in
# (scripts/compile-examples.py): the morca and dista the skills describe,
# with what `pixi shelf add morca-mojo@0.30.0 dista-mojo@0.5.1` added for
# them. Moving to a new release: README.md, "When morca or dista releases".
[workspace]
name = "skills-examples"
preview = ["pixi-build"]
channels = ["https://conda.modular.com/max", "conda-forge", "https://repo.prefix.dev/modular-community"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
mojo-compiler = "==1.2.0"
json_mlake = { git = "https://github.com/magmalake/json_mlake.git", rev = "27c05c1c0c2881abfb33ce8eefae4d44d8b602a9" }
